run_type = "scoring"
device = "cuda:0"

[parameters]
smiles_file = "logs/cmp.vigHoB/molecules.smi"
output_csv = "logs/cmp.vigHoB/old.csv"

[scoring]
type = "geometric_mean"


[[scoring.component]]
[scoring.component.TanimotoSimilarity]
[[scoring.component.TanimotoSimilarity.endpoint]]
name = "sim A1AFA"
weight = 0.5
params.smiles = ["O=C(NC(Cc1ccccc1)C(=O)O)c1ccc(Cl)cc1Cl"]
params.radius = 3
params.use_counts = true
params.use_features = true

[[scoring.component]]
[scoring.component.TanimotoSimilarity]
[[scoring.component.TanimotoSimilarity.endpoint]]
name = "sim CHEMBL4649232"
weight = 0.5
params.smiles = ["CCNC(=O)Nc1cnnc(-c2ccc(CC(NC(=O)c3c(Cl)cccc3Cl)C(=O)O)cc2)c1"]
params.radius = 3
params.use_counts = true
params.use_features = true

[[scoring.component]]
[scoring.component.TanimotoSimilarity]
[[scoring.component.TanimotoSimilarity.endpoint]]
name = "sim CHEMBL5532604"
weight = 0.5
params.smiles = ["Cc1ccc(Cl)c(C(=O)NC(CNC(=O)Cn2c(=O)[nH]c3nc(C)c(F)cc32)C(=O)O)c1F"]
params.radius = 3
params.use_counts = true
params.use_features = true

[[scoring.component]]
[scoring.component.TanimotoSimilarity]
[[scoring.component.TanimotoSimilarity.endpoint]]
name = "sim CHEMBL234562"
weight = 0.5
params.smiles = ["O=C(NC(Cc1ccc2nc(-c3c(Cl)cccc3Cl)ccc2c1)C(=O)O)c1c(Cl)cccc1Cl"]
params.radius = 3
params.use_counts = true
params.use_features = true

[[scoring.component]]
[scoring.component.TanimotoSimilarity]
[[scoring.component.TanimotoSimilarity.endpoint]]
name = "sim CHEMBL5517939"
weight = 0.5
params.smiles = ["O=C(NC(CNc1ccc(N2CCNC2=O)cc1)C(=O)O)c1c(Cl)cccc1Cl"]
params.radius = 3
params.use_counts = true
params.use_features = true

[[scoring.component]]
[scoring.component.TanimotoSimilarity]
[[scoring.component.TanimotoSimilarity.endpoint]]
name = "sim PLN-1474"
weight = 0.5
params.smiles = ["CC1(C(=O)NC(CCCCCCCc2ccc3c(n2)NCCC3)C(=O)O)CCOCC1"]
params.radius = 3
params.use_counts = true
params.use_features = true

[[scoring.component]]
[scoring.component.MatchingSubstructure]
[[scoring.component.MatchingSubstructure.endpoint]]
name = "carboxylic acid"
weight = 2
# MatchingSubstructure declares smarts: List[str] - the list spans ENDPOINTS, so
# each endpoint supplies a bare string. CustomAlerts below declares
# List[List[str]] and therefore takes a list per endpoint. Same key name, different
# shape; pydantic rejects the wrong one, which is at least loud.
params.smarts = "[CX3](=O)[OX2H1,OX1-]"
params.use_chirality = false

[[scoring.component]]
[scoring.component.TPSA]
[[scoring.component.TPSA.endpoint]]
name = "TPSA"
weight = 1
transform.type = "double_sigmoid"
transform.high = 140.0
transform.low = 40.0
transform.coef_div = 140.0
transform.coef_si = 20.0
transform.coef_se = 20.0

[[scoring.component]]
[scoring.component.SlogP]
[[scoring.component.SlogP.endpoint]]
name = "SlogP"
weight = 1
transform.type = "reverse_sigmoid"
transform.high = 4.0
transform.low = 1.0
transform.k = 0.5

[[scoring.component]]
[scoring.component.NumRotBond]
[[scoring.component.NumRotBond.endpoint]]
name = "rotatable bonds"
weight = 1
transform.type = "reverse_sigmoid"
transform.high = 10.0
transform.low = 3.0
transform.k = 0.5

[[scoring.component]]
[scoring.component.MolecularWeight]
[[scoring.component.MolecularWeight.endpoint]]
name = "MW"
weight = 1
transform.type = "double_sigmoid"
transform.high = 550.0
transform.low = 300.0
transform.coef_div = 550.0
transform.coef_si = 20.0
transform.coef_se = 20.0

[[scoring.component]]
[scoring.component.Qed]
[[scoring.component.Qed.endpoint]]
name = "QED"
weight = 1

[[scoring.component]]
[scoring.component.SAScore]
[[scoring.component.SAScore.endpoint]]
name = "SAScore"
weight = 1
transform.type = "reverse_sigmoid"
transform.high = 6.0
transform.low = 2.0
transform.k = 0.5

[[scoring.component]]
[scoring.component.CustomAlerts]
[[scoring.component.CustomAlerts.endpoint]]
name = "alerts"
params.smarts = ["[*;r8]", "[*;r9]", "[*;r10]", "N=[N+]=[N-]", "C(=O)Cl", "[SH]", "[Nr0][Nr0]"]
