# GENERATED by scripts/make_rl_config.py --arm B - do not edit by hand.
# Scoring components come from configs/_rl_scoring.frag (spec section 5.1) with the two
# v4 deviations that generator declares - NOT verbatim; see below and its
# module docstring. Hand-editing a window into this file instead is exactly
# how v4's re-derived TPSA bounds came to exist only in the generated output.
# Inception is deliberately absent - spec section 4.1: inception.py truncates
# by score and never re-admits an evicted seed, and its loss uses the PRIOR
# log-likelihood, which would push the arms in opposite directions and
# contaminate the one comparison this task exists to make.
#
# Arm B: differs from every other arm ONLY in `agent_file` below and the
# output paths that name this arm. Scoring, learning_strategy, batch_size,
# max_steps, diversity_filter, and batch ordering are identical across arms.
run_type = "staged_learning"
device = "cuda:0"
tb_logdir = "logs/v4_TL-B/tb"

[parameters]
agent_file = "priors/focused_B.prior"
prior_file = "REINVENT4/priors/reinvent.prior"
batch_size = 128
unique_sequences = true
randomize_smiles = true
summary_csv_prefix = "results/v4_TL-B/rl"

[learning_strategy]
type = "dap"
sigma = 128
rate = 0.0001

[[stage]]
max_steps = 1000
termination = "simple"
max_score = 1.0
chkpt_file = "results/v4_TL-B/rl_final.chkpt"

[stage.diversity_filter]
type = "IdenticalMurckoScaffold"
bucket_size = 25
minscore = 0.4

[stage.scoring]
type = "geometric_mean"
# Step 2 single-stage RL scoring block (blueprint section 5.1).
#
#   total = geometric_mean([(COOH, 1.0), (TPSA, 1.0)]) * alert_filter
#
# The carboxylate is a GATE, not a MatchingSubstructure penalty: that component
# hardcodes 0.5 * (1.0 + match), and under it a molecule WITHOUT the carboxylate
# scored a flat 0.500 while molecules WITH it had a median of 0.060, because the
# acid adds ~37 TPSA and falls out of the window. The agent's best move was to drop
# the MIDAS anchor. GroupCount + right_step makes absence cost 1.0e-04 instead
# (6.31e-04 before SAScore was dropped - see the v4 deviations below).
#
# TanimotoSimilarity is deliberately absent. The six references were chosen to be
# mutually DISSIMILAR (max pairwise Tanimoto 0.45), one endpoint each, under a
# geometric mean - which demands a molecule resemble six mutually unlike molecules
# at once. Prior-sample medians were 0.002-0.004 with 70% under 0.05. Potency comes
# from TL-A and inception; potency judgement comes from the section 8.5 docking
# geometry filter.
#
# v4 DEVIATIONS FROM THE FRAGMENT, applied by scripts/make_rl_config.py
# (see its module docstring for why they live there and not in the
# fragment, which is also the source of configs/score_panel.toml):
#   dropped components: SAScore
#     SAScore was a guard rail scoring 0.99998+ on every reference, so
#     it moved a total by 2.2e-06 at step 0 and only braked SA drift over
#     1000 steps. Removing weight 0.5 renormalizes the geometric mean:
#     each remaining exponent 0.4 -> 0.5, so totals fall, carboxylate
#     absence costs 1.0e-04 instead of 6.31e-04, and minscore 0.4 now
#     needs a TPSA component of 0.160 rather than 0.101. SA stays
#     measurable through configs/score_panel.toml as an observation.
#   transform overrides: TPSA low 40 -> 60, high 115 -> 140
#     results/v4_tpsa_window.md. The old ceiling penalised bexotegrast
#     (TPSA 112.5 -> 0.72) and zeroed 58% of core_B; 140 is Veber's oral
#     threshold and 60 is non-binding for every reference and lead.

[[stage.scoring.component]]
[stage.scoring.component.GroupCount]
[[stage.scoring.component.GroupCount.endpoint]]
name = "carboxylate MIDAS anchor"
weight = 1.0
params.smarts = "[CX3](=O)[OX2H1,OX1-]"
transform.type = "right_step"
transform.high = 1

# Window anchored on the two orally advanced alphaV carboxylates: PLN-1474
# (TPSA 100.6, Phase 1 completed) and bexotegrast (112.5, Phase 2a). The cpd 25
# series cannot justify the window - its high TPSA (median 133.3) just restates
# that it was never proposed as an oral structure.
[[stage.scoring.component]]
[stage.scoring.component.TPSA]
[[stage.scoring.component.TPSA.endpoint]]
name = "TPSA"
weight = 1.0
transform.type = "double_sigmoid"
transform.low = 60.0
transform.high = 140.0
transform.coef_div = 120.0
transform.coef_si = 20.0
transform.coef_se = 20.0

# The aniline pattern is [NX3;H2][c], primary aromatic amines only. The earlier
# [NH2,NH][c] zeroed 164 of 190 actives_extended (86%) and 5 of 6 benchmark
# positives, because an aryl-NH with one hydrogen matches - which catches
# tetrahydro-1,8-naphthyridine, the standard integrin Arg-mimic head.
[[stage.scoring.component]]
[stage.scoring.component.CustomAlerts]
[[stage.scoring.component.CustomAlerts.endpoint]]
name = "unwanted groups"
params.smarts = ["[NX3;H2][c]", "[*;r8]", "[*;r9]", "[*;r10]", "N=[N+]=[N-]", "C(=O)Cl", "[SH]", "[Nr0][Nr0]"]
